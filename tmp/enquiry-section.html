<section id="contact" class="ts-enquiry" aria-labelledby="ts-enquiry-title">
  <div class="container">
    <div class="ts-enquiry-layout">
      <div class="ts-enquiry-intro tp_fade_anim">
        <span class="tp-section-subtitle">Start a conversation</span>
        <h2 id="ts-enquiry-title">What do you<br>want to <span>build?</span></h2>
        <p>A new product, a stronger online store, or better systems behind the scenes. Tell us where you are and where you want to go.</p>
        <a class="ts-email-direct" href="mailto:contact@tekscaleup.com">contact@tekscaleup.com ↗</a>
      </div>
      <form id="ts-enquiry-form" class="ts-enquiry-form">
        <label for="ts-enquiry-name">Your name <span>(optional)</span></label>
        <input id="ts-enquiry-name" name="name" autocomplete="name" maxlength="120">
        <label for="ts-enquiry-service">What can we help with?</label>
        <select id="ts-enquiry-service" name="service"><option>Software &amp; design</option><option>Cloud &amp; security</option><option>Digital marketing</option><option>AI &amp; emerging tech</option><option>A combination of services</option></select>
        <label for="ts-enquiry-brief">Tell us about your project</label>
        <textarea id="ts-enquiry-brief" name="brief" rows="3" maxlength="3000" placeholder="Your goal, current challenge, and any timeline or budget you have in mind."></textarea>
        <div class="ts-enquiry-action"></div>
        <p class="ts-enquiry-note" id="ts-enquiry-status" role="status">Opens a draft in your email app. Review and send it there. You can also email us directly.</p>
      </form>
    </div>
  </div>
</section>
